name: LinkedIn Daily Ideas

on:
  schedule:
    # Primary run: 7:00 AM IST. The later runs are automatic catch-ups in
    # case GitHub delays or misses a scheduled workflow; the guard below
    # ensures only one file is generated for each IST date.
    - cron: '30 1,4,7,10,13 * * *'
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check whether today's ideas already exist
        id: today
        env:
          TZ: Asia/Kolkata
        run: |
          if [ -f "linkedin_ideas/$(date +%F).md" ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Ideas for $(date +%F) already exist; skipping generation."
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.today.outputs.generate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.today.outputs.generate == 'true'
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        if: steps.today.outputs.generate == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Neither GROQ_API_KEY nor OPENROUTER_API_KEY is configured" >&2
            exit 1
          fi
          printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" > .env
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> .env
          printf 'OPENROUTER_MODEL=%s\n' "${OPENROUTER_MODEL:-openrouter/auto}" >> .env

      - name: Generate LinkedIn post ideas
        if: steps.today.outputs.generate == 'true'
        run: python3 linkedin_agent.py

      - name: Commit daily ideas file
        if: steps.today.outputs.generate == 'true'
        run: |
          git config user.name "LinkedIn Bot"
          git config user.email "linkedin-bot@sahil"
          git add linkedin_ideas/
          git diff --staged --quiet || git commit -m "chore: linkedin ideas $(date +%Y-%m-%d) [skip ci]"
          git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}

      - name: Email ideas via Gmail SMTP
        if: steps.today.outputs.generate == 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          test -n "$GMAIL_USERNAME" || { echo "GMAIL_USERNAME secret is missing" >&2; exit 1; }
          test -n "$GMAIL_APP_PASSWORD" || { echo "GMAIL_APP_PASSWORD secret is missing" >&2; exit 1; }
          test -n "$EMAIL_TO" || { echo "EMAIL_TO secret is missing" >&2; exit 1; }
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          today = os.popen("date +%Y-%m-%d").read().strip()
          ideas_file = Path("linkedin_ideas") / f"{today}.md"
          message = EmailMessage()
          message["Subject"] = f"LinkedIn ideas — {today}"
          message["From"] = os.environ["GMAIL_USERNAME"]
          message["To"] = os.environ["EMAIL_TO"]
          message.set_content(ideas_file.read_text(encoding="utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(os.environ["GMAIL_USERNAME"], os.environ["GMAIL_APP_PASSWORD"])
              smtp.send_message(message)
          print(f"Emailed {ideas_file}")
          PY
